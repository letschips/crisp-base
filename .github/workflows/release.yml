name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release artifacts
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cd release
          zip -r ../crisp-base-$(node -p "require('../manifest.json').version").zip .
          cd ..
          ls -la *.zip

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
          generate_release_notes: true
